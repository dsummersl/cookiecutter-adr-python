[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.project_desc }}"
readme = "README.md"
requires-python = ">={{ cookiecutter.python_version }}"
authors = [
  { name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}" }
]
license = "{{ 'LicenseRef-Proprietary' if cookiecutter.license == 'Proprietary' else cookiecutter.license }}"
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.4",
  "mypy>=2.3.1",
  "pre-commit>=4.6.2",
  "radon>=6.0.1",
  "treepeat>=0.8.0",
  "vulture>=2.16",
  "ast-grep-cli>=0.39.0",
]

[tool.ruff]
line-length = 100
exclude = [".venv", ".git", "build", "dist"]
lint.select = [
  "E",   # pycodestyle
  "W",   # pycodestyle warnings (trailing/blank-line whitespace, auto-fixed after ast-grep removals)
  "F",   # Pyflakes
  "I",   # isort (automatically sorts and moves imports to top)
  "B",   # flake8-bugbear (find likely bugs and design problems in your program)
  "PLR", # Pylint Refactor (specifically catches misplaced imports)
  "PLC", # Pylint Convention (specifically catches imports not at the top of the file)
  "TID", # Tidy imports
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["PLR2004"] # Allow magic numbers in tests

[tool.mypy]
python_version = "{{ cookiecutter.python_version }}"
strict = true
packages = ["{{ cookiecutter.package_name }}"]

[tool.pytest.ini_options]
addopts = "--cov={{cookiecutter.package_name}}  --cov-report=term-missing"
